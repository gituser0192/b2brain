services:
  - type: web
    name: b2brain-staging-api
    runtime: node
    buildCommand: npm ci && npm run build:production --workspace @b2brain/backend
    preDeployCommand: npm run prisma:deploy --workspace @b2brain/backend
    startCommand: npm run start --workspace @b2brain/backend
    healthCheckPath: /api/v1/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: BRIDGE_ENCRYPTION_KEY
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
