services:
  - type: web
    name: b2brain-staging-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:production --workspace @b2brain/backend
    startCommand: npm run start --workspace @b2brain/backend
    healthCheckPath: /api/v1/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: EXTERNAL_CHANNELS_ENABLED
        value: "false"
      - key: JSON_BODY_LIMIT
        value: 1mb
      - key: API_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: API_RATE_LIMIT_MAX
        value: "1000"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: BRIDGE_ENCRYPTION_KEY
        sync: false
      - key: META_WHATSAPP_ENABLED
        value: "false"
      - key: META_WHATSAPP_OUTBOUND_ENABLED
        value: "false"
      - key: META_LEAD_ADS_ENABLED
        value: "false"
      - key: META_LEAD_GRAPH_ENABLED
        value: "false"
      - key: ENQUIRY_AI_MODE
        value: deterministic
      - key: ENQUIRY_AI_KILL_SWITCH
        value: "true"
      - key: WORKSPACE_AGENT_REASONING_BACKEND
        value: typescript
      - key: PYTHON_AGENT_ENABLED
        value: "false"
      - key: WORKSPACE_AI_PROVIDER
        value: disabled
      - key: WORKSPACE_AI_KILL_SWITCH
        value: "true"
      - key: WORKSPACE_AI_DETERMINISTIC_ONLY
        value: "true"
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
