services:
  - type: web
    name: b2brain-staging-api
    runtime: node
    buildCommand: npm ci --include=dev && npm run build:production --workspace @b2brain/backend
    preDeployCommand: npm run prisma:deploy --workspace @b2brain/backend
    startCommand: npm run start --workspace @b2brain/backend
    healthCheckPath: /api/v1/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: EXTERNAL_CHANNELS_ENABLED
        value: "false"
      - key: JSON_BODY_LIMIT
        value: 1mb
      - key: API_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: API_RATE_LIMIT_MAX
        value: "1000"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: BRIDGE_ENCRYPTION_KEY
        sync: false
      - key: META_WHATSAPP_ENABLED
        value: "false"
      - key: META_WHATSAPP_OUTBOUND_ENABLED
        value: "false"
      - key: ENQUIRY_AI_MODE
        value: deterministic
      - key: ENQUIRY_AI_KILL_SWITCH
        value: "true"
      - key: WORKSPACE_AI_PROVIDER
        value: openai
      - key: WORKSPACE_AI_KILL_SWITCH
        value: "false"
      - key: WORKSPACE_AI_DETERMINISTIC_ONLY
        value: "false"
      - key: WORKSPACE_AI_MODEL
        sync: false
      - key: WORKSPACE_AI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: WORKSPACE_AI_TIMEOUT_MS
        value: "12000"
      - key: WORKSPACE_AI_MAX_RETRIES
        value: "1"
      - key: WORKSPACE_AI_MAX_INPUT_CHARS
        value: "12000"
      - key: WORKSPACE_AI_MAX_OUTPUT_TOKENS
        value: "700"
      - key: WORKSPACE_AI_DAILY_TOKEN_LIMIT
        value: "100000"
      - key: WORKSPACE_AI_MONTHLY_TOKEN_LIMIT
        value: "1000000"
      - key: WORKSPACE_AI_DAILY_REQUEST_LIMIT
        value: "100"
      - key: WORKSPACE_AI_MAX_TOOL_ITERATIONS
        value: "1"
      - key: WORKSPACE_AI_CIRCUIT_FAILURE_THRESHOLD
        value: "3"
      - key: WORKSPACE_AI_CIRCUIT_RESET_MS
        value: "60000"
      - key: WORKSPACE_AI_INPUT_COST_PER_MILLION_USD
        sync: false
      - key: WORKSPACE_AI_OUTPUT_COST_PER_MILLION_USD
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
